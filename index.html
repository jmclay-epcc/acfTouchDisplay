  <script>

    const svgPathFile = "curve.svg";

    fetch(svgPathFile)
      .then(response => response.text())
      .then(svgText => {

        document.querySelector("#curve-container").innerHTML = svgText;

        const path = document.querySelector("#path1");
        const images = document.querySelectorAll(".system");

        const length = path.getTotalLength();

        images.forEach((image, i) => {

          const distance =
            (i / (images.length - 1)) * length;

          const point =
            path.getPointAtLength(distance);

          image.style.left = `${point.x}px`;
          image.style.top = `${point.y}px`;

        });

      });
  </script>
