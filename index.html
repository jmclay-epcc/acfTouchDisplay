<!DOCTYPE html>

<!-- This project was made with the assistance of AI.  I've made an effort to go through an manually comment the AI generated JS. -->

<html>

<head>
  <link href="style.css" rel="stylesheet" type="text/css">
  <link href="fonts.css" rel="stylesheet" type="text/css">
</head>

<body>
  <div class="background">
    <!-- This div contains everything that isn't the system cells and the modal.  So that is the background, and the header -->
    <div class="header"> <!-- This div contains the three elements of the header -->
      <img class="logo" src="logo.svg"></img>
      <div class="title">
        MACHINE HISTORY
      </div>

      <div class="subtitle">
        Interactive hardware timeline
      </div>

    </div>

  </div>

  <div id="modalOverlay" class="modalOverlay">
    <!-- This is a sort of dimming background that will appear between the modal and the rest of the page when the modal is on screen -->
    <div id="modalBox" class="modalBox">
      <div id="modalText" class="modalText"></div>
      <img id="modalImage" class="modalImage"></img>
    </div> <!-- This is the modal itself -->
  </div>

  <div id="pathContainer" class="pathContainer">
    <div id="curve-container" data-include="systems.html"></div>
    <!-- this line pulls in data from the systems.html file -->
  </div>


  <!------- enter script world -------->

  <script> // This script it taken from the internet - basically it loads the system divs in from a seperate HTML document, so that they don't all need to sit in here crowding up the place.  If you could believe it there isn't a function in HTML that just does that.  
    async function loadIncludes() { // This function is an async - this is bcause we need to do some frustrating waiting and syncing so that the two scripts in this page run is sequence.  
      const targets = document.querySelectorAll('[data-include]');
      await Promise.all([...targets].map(async el => {
        const response = await fetch(el.dataset.include);
        if (response.ok) el.innerHTML = await response.text();
        else console.error('Failed to load', el.dataset.include);
      }));
    }
  </script>

  <script>

    // Straight lines between points, with rounded corners where the direction changes
    function roundedPath(pts, radius) {
      if (pts.length < 2) return "";
      let d = `M ${pts[0].x} ${pts[0].y}`;

      for (let i = 1; i < pts.length - 1; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];

        const v1x = p1.x - p0.x, v1y = p1.y - p0.y;
        const v2x = p2.x - p1.x, v2y = p2.y - p1.y;
        const len1 = Math.hypot(v1x, v1y);
        const len2 = Math.hypot(v2x, v2y);

        // Straight-through point: no corner to round
        if (Math.abs(v1x * v2y - v1y * v2x) < 1e-6) {
          d += ` L ${p1.x} ${p1.y}`;
          continue;
        }

        // Start rounding a bit before the corner, finish a bit after it
        const r = Math.min(radius, len1 / 2, len2 / 2);
        const ax = p1.x - (v1x / len1) * r, ay = p1.y - (v1y / len1) * r;
        const bx = p1.x + (v2x / len2) * r, by = p1.y + (v2y / len2) * r;

        d += ` L ${ax} ${ay} Q ${p1.x} ${p1.y}, ${bx} ${by}`;
      }

      const last = pts[pts.length - 1];
      d += ` L ${last.x} ${last.y}`;
      return d;
    }

    const FIXED_COLS = null; // This value is used to define the number of columns if that is desired.  When set to null, the script decides how many columns to use itself.  

    function layoutSystems() { // This function works out who the divs should be sized and placed on the screen to form a neat grid, and then moves them into position.  
      const container = document.getElementById("pathContainer"); // brings the div pathContainer into the script.  
      const systems = [...container.querySelectorAll("div.system")]; // brings all of the divs with class "system" into the script.  
      const n = systems.length; // finds the number of divs with class "system"
      if (n === 0) return; // Quits out of the script if that number is zero (really we don't need this because, realistically, that'll never happen.  But hey its good to have error handling i guess). 

      const W = container.clientWidth; // Finds the width of pathContainer
      const H = container.clientHeight; // Finds the height of pathContainer

      // Pick the column count that gives the biggest square cells that still fit
      let cols = FIXED_COLS, cell; // This line declares two variables - cols and cell.  cols is the number of columns, and cell is the side-length of the grid spaces that the system divs will be arranged in (this isn't exactly the same as the final size of the system divs, as they have some spacing, but its equivalent.  Bigger cell means bigger system divs).  
      if (cols) { // if cols is a real number (e.g. FIXED_COL is given a real-number value earlier in the script)...
        cell = Math.min(W / cols, H / Math.ceil(n / cols)); // ... The side-length of the grid spaces is set to either w/cols, or h/(n/cols).  Whichever value is smaller is used.  
      } else { // if col is NOT a real number (e.g. it is left undefined), then we need to work out how many columns we would need in order to fit all the system divs into pathContainer, while making them as big as we can.  
        cell = 0; // Cell is first set to 0...
        for (let c = 1; c <= n; c++) { // ... And then we enter a for-loop running from 1 to n, where c increments up in steps of 1 from an initial value of 1.  
          const size = Math.min(W / c, H / Math.ceil(n / c)); // For each step in the loop we find w/c and h/(n/c), and then set size equal to the lowest of the two.  
          if (size > cell) { cell = size; cols = c; } // If that value of size is larger than the current value of cell, we set cell = size and cols = c.  
        }
      }
      const rows = Math.ceil(n / cols); // Now that we have our number of columns, we can work out how many rows we need by dividing the number of system divs by the number of columns, and rounding up.  
      const xScale = W / (cell * cols); // For certain screen sizes and system numbers (for example, 900x1400 and 36 ssytems), you can end up with a weirdly skinny grid.  This variable calculates the ratio of the width of pathContainer to the width of the grid, which we can then use to stretch the grid horizontally, so that it always fills pathContainer.  
      const yScale = H / (cell * rows); // This is the same thing but height.  I've found this issue crops up less frequently but its good to be thourough.  

      // Centre the whole grid inside the container.  
      const offX = (W - cols * cell * xScale) / 2;
      const offY = (H - rows * cell * yScale) / 2;

      const centres = []; // Defines centres as an empty array.  

      systems.forEach((div, i) => { // This sets up a loop that runs over each item in the systems array (e.g. each div with class system).  The variable "div" is set equal to the div at position i in systems.  
        const row = Math.floor(i / cols); // This line finds the row that the div should fall in.  It does this by dividing the divs position in systems by the number of columns, and then rouding that value down.  So if cols = 5, the divs 0-4 will return a row number of 0, 5-9 will return 1, etc.  
        let col = i % cols; // This line finds the column that the div should fall in.  It does this by dividing the position of the div in systems by the number of columns, and then returning the remainder.  So if cols = 5, div 0 will return a value of 0 (0/5 = 0 with 0 remainder), div 1 will return 1 (1/5 = 0 with 1 remainder), div 5 will return 0 (5/5 = 1 with 0 remainder), etc.  
        if (row % 2 === 1) col = cols - 1 - col;  // This line checks if the row is odd, and inverts the column value if it is (for cols = 5, 0 > 4, 1 > 3, 2 remains 2, 3 > 1, and 4 > 0).  

        const x = offX + (col + 0.5) * (cell * xScale); // These two lines find the central point of where the div should be placed on the screen, based off of the col and row values found earlier.  
        const y = offY + (rows - 1 - row + 0.5) * cell * yScale;  // This line is a little different to the previous one as we want row 0 to be at the bottom.  
        centres.push({ x, y }); // With these X and Y positions found, we store these in the ith position of centres. Once this for-loop ends, centres will be an ordered list of the positions of each div.  

        div.style.left = x + "px"; // We move the div to the right x position value.  
        div.style.top = y + "px"; // We move the div to the right y position value. 
        div.style.width = div.style.height = (cell * 0.75) + "px";  // We set the width of the div, making it 80% the total width of the grid spacing so that there is a small gap between each box.  
      });

      // Remove the old line (this function reruns on resize)
      const oldLine = container.querySelector("svg.timelineLine");
      if (oldLine) oldLine.remove();

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("class", "timelineLine");
      svg.setAttribute("width", W);
      svg.setAttribute("height", H);

      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", roundedPath(centres, cell * 0.25));
      path.setAttribute("stroke-width", Math.max(4, cell * 0.075));
      svg.appendChild(path);
      container.appendChild(svg);


    }

    loadIncludes().then(() => { // This is async mumbojumbo.  I don't know how it works it just does.  
      layoutSystems(); // Runs the function that we just defined.  
      window.addEventListener("resize", layoutSystems); // Runs the function again if the window is resized (which in practise will never actually happen but hey-ho)
    });
  </script>

  <script>

    const overlay = document.getElementById("modalOverlay"); // Brings the div modalOverlay into the script.  
    const modalBox = document.getElementById("modalBox"); // Brings the div modalBox into the script.  
    const modalText = document.getElementById("modalText");
    const modalImage = document.getElementById("modalImage");

    function attachModalListeners() {
      document.querySelectorAll("div.system:not(.transition)").forEach(div => {
        div.addEventListener("click", async () => {
          const infoPath = div.dataset.info;
          const imagePath = div.querySelector("img.systemImage").src;

          modalText.textContent = "Loading system info... (you should probably never see this... Is the Raspberry Pi doing alright?)";   // shown briefly while the fetch is in flight
          overlay.classList.add("open");

          if (!infoPath) {
            modalText.textContent = "No location for the system info doc has been given.  Check systems.html!";
            return;
          }

          if (!imagePath) {
            modalText.textContent = "This system doesn't have an image attached to it.  Check systems.html!";
            return;
          }

          try {
            const response = await fetch(infoPath);
            if (!response.ok) throw new Error(response.status);
            modalText.textContent = await response.text();
          } catch (err) {
            modalText.textContent = "The file at the specificed location is bad, or maybe something else is wrong.  Check your directory!";
            console.error("Failed to load", infoPath, err);
          }

          modalImage.classList.remove("imgWide", "imgTall");   // clear the previous image's shape
          modalText.classList.remove("textSkinny");
          modalImage.onload = () => {
            if (modalImage.naturalWidth > modalImage.naturalHeight) {
              modalImage.classList.add("imgWide");
            } else {
              modalImage.classList.add("imgTall");
              modalText.classList.add("textSkinny");
            }
          };
          modalImage.src = imagePath;                    // set onload before src

        });
      });
    }

    overlay.addEventListener("click", (e) => { // Listens for the modal overlay being clicked (which is to say, the modal is open and the user clicked off of it).  
      if (e.target === overlay) {
        overlay.classList.remove("open"); // Removes the overlays "open" style.  
      }
    });

    loadIncludes().then(() => { // Async stuff.  Martian nonsense to me.  
      layoutSystems();
      attachModalListeners();
      window.addEventListener("resize", layoutSystems);
    });

  </script>

  <!------- exit script world -------->

</body>

</html>
